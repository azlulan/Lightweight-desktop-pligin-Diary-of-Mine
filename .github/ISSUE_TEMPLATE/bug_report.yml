name: 缺陷报告
description: 报告可复现的功能或界面问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请只使用虚构数据。不要上传真实日记、日志、转储、个人路径或凭据。安全问题请按照 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 例如 1.1.1、提交 SHA 或源码日期
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、.NET 版本、Debug/Release
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用虚构内容给出最小复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: dropdown
    id: data_impact
    attributes:
      label: 是否涉及数据风险
      options:
        - 不涉及
        - 可能丢失或覆盖虚构测试数据
        - 可能影响真实用户数据（请停止公开披露并改用安全报告）
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除截图、日志和附件中的私人信息
          required: true
